<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vostok 1 (8K72K) — three.js</title>
<style>
  :root { --ink:#d7dee8; --dim:#7f8b9c; --panel:rgba(10,14,20,.72); --line:rgba(150,170,200,.18); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#05070a; overflow:hidden;
              font:13px/1.45 "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace; color:var(--ink); }
  canvas { display:block; }

  #ui { position:fixed; top:12px; left:12px; width:262px; padding:14px 15px 13px;
        background:var(--panel); border:1px solid var(--line); border-radius:9px;
        backdrop-filter:blur(9px); user-select:none; z-index:10; }
  #ui h1 { margin:0 0 2px; font-size:13px; letter-spacing:.09em; text-transform:uppercase; color:#fff; }
  #ui .sub { color:var(--dim); font-size:11px; margin-bottom:11px; }
  #ui .sub b { color:#9fb0c6; font-weight:400; }

  label.row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:9px 0 3px; }
  label.row span { color:var(--dim); }
  label.row output { color:#fff; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:#d33; height:20px; }

  button { font:inherit; color:var(--ink); background:rgba(255,255,255,.05);
           border:1px solid var(--line); border-radius:6px; padding:6px 9px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.12); }
  button.on { background:#c8202a; border-color:#e8384a; color:#fff; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:11px; }
  .btns button { flex:1 1 auto; }

  #hover { position:fixed; bottom:12px; left:12px; padding:6px 10px; font-size:11px;
           background:var(--panel); border:1px solid var(--line); border-radius:6px; z-index:10; }
  #hover b { color:#fff; font-weight:400; }
  #legend { position:fixed; bottom:12px; right:12px; font-size:11px; color:var(--dim); text-align:right; z-index:10; }
  kbd { background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:3px; padding:0 4px; }

  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          background:#05070a; z-index:50; color:var(--dim); letter-spacing:.12em; }
  #load.done { opacity:0; pointer-events:none; transition:opacity .5s; }
  #err { color:#ff6b6b; max-width:70ch; text-align:center; }
</style>
</head>
<body>

<div id="ui">
  <h1>Vostok&nbsp;1 · 8K72K</h1>
  <div class="sub">12 April 1961 · <b id="poly">—</b> tris</div>

  <label class="row"><span>separation</span><output id="sepV">0%</output></label>
  <input type="range" id="sep" min="0" max="100" value="0">

  <div class="btns">
    <button id="play">▶ stage</button>
    <button id="spin">spin: on</button>
    <button id="fair">fairing: on</button>
    <button id="reset">reset</button>
  </div>
</div>

<div id="hover">—</div>
<div id="legend">drag orbit · wheel zoom · <kbd>space</kbd> stage · <kbd>H</kbd> fairing<br><a href="launch.html">&#9654; launch sequence &amp; orbit</a></div>
<div id="load">LOADING VOSTOK&nbsp;1…<div id="err"></div></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script>
  // surface any module/runtime failure instead of a silent "loading" screen
  function showErr(msg) {
    var el = document.getElementById('err');
    if (el) el.textContent += (el.textContent ? '\n' : '') + msg;
  }
  addEventListener('error', function (e) {
    showErr('ERROR: ' + (e.message || e.type) +
            (e.filename ? '  @ ' + e.filename + ':' + e.lineno : ''));
  }, true);
  addEventListener('unhandledrejection', function (e) {
    showErr('REJECTED: ' + ((e.reason && e.reason.message) || e.reason));
  });
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
